deepseek.api.url=https://api.deepseek.com/chat/completions
deepseek.model=deepseek-chat
# deepseek-chat 的输出上限是 8192,写大了会被 API 拒绝
deepseek.maxTokens=8192
deepseek.timeoutSeconds=30
app.debug=false
extract.chunkSize=800
extract.overlap=100
llm.requestTimeoutSeconds=120
llm.maxAttempts=5
llm.retryBaseMs=2000
llm.retryMaxMs=20000
knowledge.file=knowledge/base.json
vision.api.url=https://api.moonshot.cn/v1/chat/completions
vision.model=kimi-k2.6
vision.maxTokens=4096
qa.topK=5

# ---------- 检索:本地 embedding(llama.cpp llama-server)----------
embedding.url=http://127.0.0.1:8090
embedding.model=bge-small-zh-v1.5